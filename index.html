<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SushiGrow — 3D Garden</title><style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=DM+Mono&display=swap');:root{--cream:#fff7e8;--ink:#202143;--pink:#ff6d88;--mint:#76e5c1}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#59c9cf;font-family:'Baloo 2',sans-serif;color:var(--cream)}#ui{position:fixed;inset:0;pointer-events:none;z-index:2}.top{height:78px;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#1e244dcc,transparent)}.brand{display:flex;gap:10px;align-items:center;font-size:25px;font-weight:800;letter-spacing:.03em}.brand small{display:block;font:9px 'DM Mono';letter-spacing:.18em;color:#b8fff0}.logo{width:44px;height:44px;filter:drop-shadow(0 5px 8px #25204d66)}.stats{display:flex;gap:8px}.pill,.panel{background:#242344d9;border:1px solid #ffffff2b;border-radius:14px;padding:8px 13px;font:12px 'DM Mono';box-shadow:0 8px 24px #20204433}.pill b{color:#ffd481;font-size:14px}.left{position:absolute;left:20px;top:102px;width:230px}.panel{padding:16px;pointer-events:auto}.panel h3{margin:0 0 8px;font-size:17px}.panel p{margin:4px 0;color:#e3d8ef;font-size:13px;line-height:1.3}.progress{height:7px;background:#ffffff28;border-radius:8px;margin-top:10px;overflow:hidden}.progress i{display:block;width:20%;height:100%;background:var(--mint)}.bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.slot{width:54px;height:54px;border-radius:14px;background:#242344e8;border:2px solid #ffffff35;color:white;font-size:24px;box-shadow:0 7px 16px #20163d55}.slot.active{border-color:#ffd481;transform:translateY(-5px)}.hint{position:absolute;right:20px;bottom:22px;background:#242344d9;border-radius:12px;padding:9px 12px;font:11px 'DM Mono'}button{font:inherit;cursor:pointer;color:inherit}.toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:#fff7e8;color:#292044;border-radius:999px;padding:10px 18px;font-weight:800;opacity:0;transition:.25s}.toast.show{opacity:1}.cross{position:absolute;inset:0;display:grid;place-items:center;color:#fff8;font-size:20px;text-shadow:0 2px 3px #000;pointer-events:none}@media(max-width:700px){.left{left:10px;top:86px;width:190px}.top{padding:10px}.brand{font-size:20px}.stats{gap:3px}.pill{padding:7px}.hint{display:none}.bottom{bottom:12px}}
</style></head><body><div id="ui"><header class="top"><div class="brand"><svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="g"><stop stop-color="#ff8496"/><stop offset="1" stop-color="#70e5bf"/></linearGradient></defs><path fill="url(#g)" d="M32 3C14 3 3 15 3 30c0 13 10 24 24 27l5 4 5-4c14-3 24-14 24-27C61 15 50 3 32 3Z"/><path fill="#fff7e8" d="M13 34c0-14 13-22 27-22 5 0 10 1 14 4-2 14-14 26-29 26-5 0-9-2-12-4Z"/><circle cx="29" cy="25" r="7" fill="#292044"/><circle cx="42" cy="33" r="5" fill="#292044"/><path fill="#ff7182" d="M10 41c7 7 17 8 27 4-5 7-17 9-26 3Z"/></svg><div>SUSHIGROW<small>GROW · GATHER · CREATE</small></div></div><div class="stats"><div class="pill">🪙 <b id="coins">120</b></div><div class="pill">🌱 <b id="seeds">6</b></div><div class="pill">⭐ LV <b id="level">1</b></div></div></header><aside class="left panel"><h3>🌊 Tide Garden</h3><p id="quest">Restore the island garden</p><p><b id="harvested">0</b> / 6 crops harvested</p><div class="progress"><i id="bar"></i></div><p style="margin-top:10px">Click a soil plot to plant. Click a ripe crop to harvest.</p></aside><div class="bottom"><button class="slot active" data-tool="seed">🌱</button><button class="slot" data-tool="hoe">⛏️</button><button class="slot" data-tool="hand">✋</button></div><div class="hint">WASD / ARROWS · drag to orbit · wheel to zoom</div><div class="toast" id="toast"></div></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0?bundle';import {OrbitControls} from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js?bundle';
const save=JSON.parse(localStorage.sushigrow3d||'null')||{coins:120,seeds:6,level:1,harvested:0,plots:{}};const scene=new THREE.Scene();scene.background=new THREE.Color('#69cbd0');scene.fog=new THREE.Fog('#69cbd0',20,42);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(13,15,15);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enablePan=false;controls.minDistance=10;controls.maxDistance=25;controls.maxPolarAngle=1.35;
scene.add(new THREE.HemisphereLight('#e9ffff','#3d4a67',2.1));const sun=new THREE.DirectionalLight('#fff1c3',3);sun.position.set(-8,16,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const box=(x,y,z,c)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));m.castShadow=m.receiveShadow=true;return m};const cyl=(r,h,c)=>{let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.88,h,8),mat(c));m.castShadow=m.receiveShadow=true;return m};
const island=box(25,.8,19,'#78cfa3');island.position.y=-.55;island.receiveShadow=true;scene.add(island);const water=box(38,.2,32,'#349fbd');water.position.y=-1;scene.add(water);const path=box(4,.08,19,'#d9ad73');path.position.y=-.12;scene.add(path);const bridge=box(7,.35,2,'#9b684d');bridge.position.set(9,0,5);scene.add(bridge);
function tree(x,z,scale=1){let g=new THREE.Group();let trunk=cyl(.28,2,'#80523d');trunk.position.y=1;g.add(trunk);for(const [a,b,s] of [[0,2.7,1.35],[-.8,2.3,.9],[.8,2.25,.9]]){let leaf=cyl(.8*s,1.2*s,'#398c6b');leaf.position.set(a,b,0);g.add(leaf)}g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g)}for(const p of [[-8,-6],[8,-6],[-9,5],[9,-3],[-6,7],[7,7]])tree(...p,.9);
const house=new THREE.Group();house.add(box(5,2.8,3.5,'#f5c878'));house.children[0].position.y=1.4;let roof=box(5.7,.55,4.2,'#e76879');roof.position.y=3;roof.rotation.z=.04;house.add(roof);let door=box(.8,1.4,.1,'#594263');door.position.set(0,.7,1.78);house.add(door);house.position.set(-5,0,-5);scene.add(house);
const plotGroup=new THREE.Group(),plots=[];scene.add(plotGroup);for(let i=0;i<12;i++){let x=-5+(i%4)*2.2,z=1+Math.floor(i/4)*2.1;let p=box(1.75,.18,1.55,'#8d6048');p.position.set(x,0,z);p.userData={id:i,state:save.plots[i]||'empty',at:save.plots[i]&&save.plots[i].at||0};plotGroup.add(p);plots.push(p)}
const farmer=new THREE.Group();let body=box(.75,1.1,.55,'#ff866f');body.position.y=1;farmer.add(body);let head=cyl(.38,.55,'#ffe1ae');head.rotation.x=Math.PI/2;head.position.y=1.9;farmer.add(head);let hat=box(.9,.18,.75,'#493d80');hat.position.y=2.3;farmer.add(hat);farmer.position.set(0,0,7);scene.add(farmer);const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);let hit=ray.intersectObjects(plots)[0];if(hit){let p=hit.object;if(p.userData.state==='empty'&&save.seeds>0){p.userData.state='growing';p.userData.at=Date.now();save.seeds--;toast('Seed planted')}else if(p.userData.state==='ripe'){p.userData.state='empty';save.coins+=28;save.harvested++;save.xp=(save.xp||0)+12;if(save.xp>=100){save.level++;save.xp=0}toast('+28 coins · harvest collected')}persist()}});function persist(){localStorage.sushigrow3d=JSON.stringify({coins:save.coins,seeds:save.seeds,level:save.level,harvested:save.harvested,xp:save.xp,plots:Object.fromEntries(plots.map((p,i)=>[i,{state:p.userData.state,at:p.userData.at}]))})}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1300)}function ui(){coins.textContent=save.coins;seeds.textContent=save.seeds;level.textContent=save.level;harvested.textContent=save.harvested;bar.style.width=Math.min(100,save.harvested/6*100)+'%'}function loop(){requestAnimationFrame(loop);let s=.11;if(keys.w||keys.arrowup)farmer.position.z-=s;if(keys.s||keys.arrowdown)farmer.position.z+=s;if(keys.a||keys.arrowleft)farmer.position.x-=s;if(keys.d||keys.arrowright)farmer.position.x+=s;farmer.position.x=THREE.MathUtils.clamp(farmer.position.x,-10,10);farmer.position.z=THREE.MathUtils.clamp(farmer.position.z,-8,8);for(const p of plots){if(p.userData.state==='growing'&&Date.now()-p.userData.at>6500)p.userData.state='ripe';p.children[0]?.removeFromParent();if(p.userData.state!=='empty'){let plant=cyl(p.userData.state==='ripe'?.5:.22,p.userData.state==='ripe'?.9:.45,p.userData.state==='ripe'?'#ff6d88':'#58c878');plant.position.y=p.userData.state==='ripe'?.58:.38;p.add(plant)}}ui();renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop();
</script></body></html>
