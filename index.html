<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bullet Bunny</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#16152b;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none;padding:18px;font-weight:800}.title{font-size:22px;color:#ffc85b;text-shadow:3px 3px #542d65}.stats{display:flex;gap:10px;margin-top:8px}.pill{background:#25223e;border:2px solid #62537e;border-radius:10px;padding:7px 11px;font-size:13px}.help{position:absolute;right:18px;top:18px;text-align:right;font-size:12px;color:#c4badc}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#121026cc}.box{background:#292344;border:3px solid #ffc85b;border-radius:18px;padding:30px;text-align:center;box-shadow:0 18px 50px #0008}.box h1{margin:0;color:#ffc85b;font-size:48px}.box p{color:#d4cbea}.box button{background:#ff6b7e;border:0;border-radius:10px;padding:12px 25px;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.hidden{display:none}</style></head><body><canvas id="game" width="960" height="540"></canvas><div class="hud"><div class="title">🐰 BULLET BUNNY</div><div class="stats"><div class="pill">❤ <span id="hp">5</span></div><div class="pill">✦ <span id="score">0</span></div><div class="pill">WAVE <span id="wave">1</span></div></div><div class="help">WASD / ARROWS move · MOUSE aim · CLICK shoot</div></div><div class="overlay" id="start"><div class="box"><h1>BULLET BUNNY</h1><p>Garden Siege · survive the carrot marauders</p><button id="play">START RUN</button></div></div><div class="overlay hidden" id="over"><div class="box"><h1>RUN OVER</h1><p>Score: <b id="final">0</b></p><button id="again">TRY AGAIN</button></div></div><script>const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height;let keys={},mouse={x:W/2,y:H/2},shots=[],foes=[],state;function reset(){state={hp:5,score:0,wave:1,over:false,player:{x:W/2,y:H/2,cool:0}};shots=[];foes=[];for(let i=0;i<5;i++)spawn()}function spawn(){let side=Math.floor(Math.random()*4),p=side===0?[Math.random()*W,-25]:side===1?[W+25,Math.random()*H]:side===2?[Math.random()*W,H+25]:[-25,Math.random()*H];foes.push({x:p[0],y:p[1],hp:2,s:Math.random()*.35+.55})}addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});c.addEventListener('mousedown',()=>{if(state&&!state.over)shoot()});function shoot(){if(state.player.cool>0)return;let p=state.player,a=Math.atan2(mouse.y-p.y,mouse.x-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8});p.cool=12}function circle(px,py,r,col){x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill()}function drawBunny(p){x.save();x.translate(p.x,p.y);let a=Math.atan2(mouse.y-p.y,mouse.x-p.x);x.rotate(a*.12);x.fillStyle='#f4edf1';x.beginPath();x.ellipse(0,4,21,17,0,0,7);x.fill();x.fillStyle='#ff8291';x.beginPath();x.ellipse(-9,-25,7,21,-.25,0,7);x.ellipse(9,-25,7,21,.25,0,7);x.fill();circle(0,-10,17,'#fff6f2');circle(-6,-12,3,'#312749');circle(7,-12,3,'#312749');x.fillStyle='#ff8291';x.fillRect(17,-4,25,7);x.restore()}function loop(){requestAnimationFrame(loop);if(!state||state.over)return;let p=state.player;if(keys.w||keys.arrowup)p.y-=3;if(keys.s||keys.arrowdown)p.y+=3;if(keys.a||keys.arrowleft)p.x-=3;if(keys.d||keys.arrowright)p.x+=3;p.x=Math.max(35,Math.min(W-35,p.x));p.y=Math.max(35,Math.min(H-35,p.y));if(p.cool)p.cool--;shots.forEach(q=>{q.x+=q.vx;q.y+=q.vy});for(const f of foes){let a=Math.atan2(p.y-f.y,p.x-f.x);f.x+=Math.cos(a)*f.s;f.y+=Math.sin(a)*f.s;if(Math.hypot(p.x-f.x,p.y-f.y)<30){state.hp--;f.x=-100;if(state.hp<=0){state.over=true;document.querySelector('#final').textContent=state.score;document.querySelector('#over').classList.remove('hidden')}}}for(const q of shots)for(const f of foes)if(f.x>-50&&Math.hypot(q.x-f.x,q.y-f.y)<20){f.hp--;q.x=-999;if(f.hp<=0){f.x=-100;state.score+=10}}foes=foes.filter(f=>f.x>-80);while(foes.length<5+state.wave)spawn();x.fillStyle='#7bd5be';x.fillRect(0,0,W,H);x.fillStyle='#9be4b1';for(let i=0;i<70;i++){let xx=(i*137)%W,yy=(i*71)%H;x.fillRect(xx,yy,3,3)}x.fillStyle='#d6a46a';x.fillRect(80,80,W-160,H-160);x.fillStyle='#b97959';for(let i=0;i<12;i++)x.fillRect(110+(i%4)*190,110+Math.floor(i/4)*130,105,70);for(const q of shots)circle(q.x,q.y,5,'#ffe56c');for(const f of foes){circle(f.x,f.y,18,'#9b61c8');circle(f.x-6,f.y-3,3,'#fff');circle(f.x+6,f.y-3,3,'#fff')}drawBunny(p);document.querySelector('#hp').textContent=state.hp;document.querySelector('#score').textContent=state.score;document.querySelector('#wave').textContent=state.wave}document.querySelector('#play').onclick=()=>{reset();document.querySelector('#start').classList.add('hidden')};document.querySelector('#again').onclick=()=>{reset();document.querySelector('#over').classList.add('hidden')};reset();setInterval(()=>{if(state&&!state.over&&state.score>0&&state.score%100===0)state.wave++},1000);loop();</script></body></html>
